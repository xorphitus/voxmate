<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>voxmate — Scene editor</title>
  </head>
  <body class="editor">
    <header class="toolbar">
      <button type="button" id="new">New</button>
      <button type="button" id="open" title="Open a scene, or import a VOICEVOX project's talk track">Open…</button>
      <button type="button" id="save">Save…</button>
      <button type="button" id="export" title="Synthesize the whole scene into one WAV file">Export WAV…</button>
      <span class="spacer"></span>
      <button type="button" id="play-all" class="primary">▶ Play all</button>
      <button type="button" id="stop">■ Stop</button>
    </header>
    <p id="status" role="status"></p>

    <ol id="lines"></ol>
    <button type="button" id="add">+ Add line</button>

    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
