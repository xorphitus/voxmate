<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>voxmate</title>
  </head>
  <body>
    <main id="stage">
      <div id="placeholder">
        <p id="placeholder-title">No model loaded.</p>
        <p id="placeholder-hint"><small>Load a <code>.vrm</code> or <code>.model3.json</code> file to begin.</small></p>
        <button type="button" id="placeholder-load" class="primary">Load model…</button>
      </div>
    </main>

    <button id="toggle-panel" type="button" title="Show/hide controls" aria-expanded="true">☰</button>

    <section id="panel">
      <p id="status" role="status"></p>

      <form id="say">
        <textarea id="text" rows="2" placeholder="話す内容 (Ctrl/⌘+Enter で送信)"></textarea>
        <div class="row">
          <button type="submit" class="primary">Speak</button>
          <button type="button" id="ask" title="Ask the LLM and speak its reply">Ask</button>
          <button type="button" id="stop">Stop</button>
          <span id="queue-info"></span>
        </div>
      </form>

      <div class="row">
        <select id="character" aria-label="Character on stage"></select>
        <select id="speaker" aria-label="Speaker"></select>
        <button type="button" id="refresh-speakers" title="Reload speakers">↻</button>
        <button type="button" id="load-model">Load model…</button>
      </div>

      <details id="settings">
        <summary>Settings</summary>
        <div class="grid">
          <label for="voicevox-url">VOICEVOX URL</label>
          <div class="row">
            <input id="voicevox-url" type="url" spellcheck="false" />
            <button type="button" id="voicevox-apply">Apply</button>
          </div>

          <label for="volume">Volume</label>
          <input id="volume" type="range" min="0" max="1" step="0.05" />

          <label for="theme">Theme</label>
          <select id="theme">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>

          <span>Window</span>
          <div>
            <label><input id="always-on-top" type="checkbox" /> Always on top</label>
            <label><input id="transparent" type="checkbox" /> Transparent background <small>(restart)</small></label>
          </div>

          <span>Character</span>
          <div class="row">
            <button type="button" id="character-add">Add</button>
            <button type="button" id="character-duplicate">Duplicate</button>
            <button type="button" id="character-remove">Remove</button>
          </div>

          <label for="character-name">Name</label>
          <input id="character-name" type="text" />

          <label for="character-id">Id</label>
          <div><input id="character-id" type="text" spellcheck="false" /> <small>used by the API</small></div>

          <span>Model</span>
          <small id="character-model"></small>

          <label for="character-persona">Persona</label>
          <textarea id="character-persona" rows="3" placeholder="System prompt for the LLM"></textarea>

          <label for="character-llm-model">LLM model</label>
          <input id="character-llm-model" type="text" spellcheck="false" placeholder="same as below" />

          <label for="llm-url">LLM URL</label>
          <input id="llm-url" type="url" spellcheck="false" placeholder="http://127.0.0.1:8080" />

          <label for="llm-model">Default LLM model</label>
          <input id="llm-model" type="text" spellcheck="false" placeholder="as named in llama-swap" />

          <label for="llm-history">History</label>
          <div><input id="llm-history" type="number" min="0" max="200" /> <small>messages</small></div>

          <span>Local API</span>
          <div>
            <label><input id="api-enabled" type="checkbox" /> Enabled <small>(restart)</small></label>
            <label>Port <input id="api-port" type="number" min="1024" max="65535" /> <small>(restart)</small></label>
            <p id="api-status"></p>
          </div>
        </div>
      </details>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
